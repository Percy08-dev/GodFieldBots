[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "godfieldbots-native"
version = "0.1.0"
description = "Native verified preprocessing for GodFieldBots"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4"]

[tool.maturin]
bindings = "pyo3"
module-name = "gf_native"
targets = [{ name = "gf_native", kind = "cdylib" }]
features = ["pyo3/extension-module"]
include = [
  "assets/structured-token-recipe-v1.json",
  "assets/structured-token-recipe-public-exact-v2.json",
  { path = "gf_native_runtime/**/*", format = "wheel" },
]
