[package]
name = "godfieldbots-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "gf_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
numpy = "=0.30.0"
ndarray = "=0.17.2"
sha2 = "=0.10.9"
ryu = "=1.0.23"
libc = "=0.2.191"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "float_roundtrip"] }

[build-dependencies]
sha2 = "=0.10.9"
