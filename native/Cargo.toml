[package]
name = "godfieldbots-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "gf_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gf-player-supervisor"
path = "src/bin/gf-player-supervisor.rs"

[features]
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
numpy = "=0.30.0"
ndarray = "=0.17.2"
sha2 = "=0.10.9"
ryu = "=1.0.23"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "float_roundtrip"] }
bytemuck = "=1.25.2"
rayon = "=1.12.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
zstd = "=0.13.3"
mimalloc = { version = "=0.1.52", optional = true, features = ["local_dynamic_tls"] }

[build-dependencies]
sha2 = "=0.10.9"
