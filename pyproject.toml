[project]
name = "godfieldbots"
version = "0.1.0"
description = "Public-information GodField bots, reproducible collection and evaluation"
readme = "README.md"
authors = [
    { name = "Percy", email = "s.suzuki23@keio.jp" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "numpy==2.5.4",
]

[project.optional-dependencies]
data = ["pyarrow>=22,<30"]
lightgbm = ["lightgbm>=4.6,<5"]
torch = ["torch==2.14.1", "torchvision==0.29.1"]
torch-cuda = ["torch==2.14.1", "torchvision==0.29.1"]
native = ["godfieldbots-native==0.1.0"]
hpo = ["optuna==5.0.0"]
shared-inference = ["torchrl==0.15.0", "tensordict==0.15.2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[project.scripts]
godfieldbots = "godfieldbots:main"
gf-bots = "gf_cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["godfieldbots", "gf_common", "gf_simulator_client", "gf_training", "gf_evaluation", "gf_models", "gf_cli"]

[tool.uv]
conflicts = [[{ extra = "torch" }, { extra = "torch-cuda" }]]

[tool.uv.sources]
godfieldbots-native = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "torch" },
    { index = "pytorch-cu132", extra = "torch-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "torch" },
    { index = "pytorch-cu132", extra = "torch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["native"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in checks using a prebuilt external TestServer"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "lightgbm", "lightgbm.*", "torchrl", "torchrl.*", "tensordict", "tensordict.*"]
ignore_missing_imports = true
