# Small nonformal base for refresh-opponent functional checks and HPO composition.
schema_version = 1
kind = "experiment"

[references]
actions = "../actions/card-instance-v2-corrected.toml"
model = "../models/card-instance-mlp.toml"
opponent = "../models/random.toml"
preprocessing = "../preprocessing/card-instance-python.toml"

[actions]
max_sequence_length = 3
max_candidates = 128
max_expansions = 8192
max_temporary_candidates = 8192
search_milliseconds = 250

[run]
name = "heuristic-refresh-ppo-base"
output_dir = "../../runs/heuristic-refresh/ppo-base"
split = "train"
wall_seconds = 600
admission_seconds = 480
execution_seconds = 540
finalization_seconds = 60
sampling_seeds = [17]

[server]
gameplay_api = "v2"
simulator_revision = "91d5926a7572db327eaea3751e7c24f428120996"
source_dir = "../../../GodFieldSimurator"
binary = "../../../GodFieldSimurator/target/release/gf-test-server"
config = "../test-server.toml"
fixed_seed_experiment = true

[training]
algorithm = "ppo"
device = "cpu"
seeds = [17]
max_updates = 2
