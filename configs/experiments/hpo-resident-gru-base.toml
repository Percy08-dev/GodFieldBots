# Resident HPO functional base; not a formal training declaration.
schema_version = 1
kind = "experiment"

[references]
actions = "../actions/card-instance-v2-corrected.toml"
model = "../models/card-instance-gru.toml"
opponent = "../models/random.toml"
preprocessing = "../preprocessing/card-instance-native.toml"

[run]
name = "hpo-resident-gru-base"
